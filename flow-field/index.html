<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flow Field Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #000;
      touch-action: pan-y;
      -webkit-text-size-adjust: 100%;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: none;
    }
    .scroll-space {
      height: 300vh;
      width: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Canvas for interactive background flow field -->
  <canvas id="c" width="800" height="600" aria-hidden="true"></canvas>
  <div class="scroll-space" aria-hidden="true"></div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: false });

      let physW = 0, physH = 0;
      let cols = 0, rows = 0;

      // Responsive grid parameters
      let GX = 18;
      let GY = 14;
      let maxHalfDash = 7.5;
      let hoverRadius = 140;
      let invRadius = 1 / hoverRadius;
      let lineStrokeWidth = 1.3;
      let isMobileState = false;

      // Pre-allocated flat buffers (0B GC overhead in render loop)
      const NUM_BUCKETS = 6;
      const MAX_LINES = 45000;
      const bucketBuffers = new Array(NUM_BUCKETS);
      const bucketCounts = new Uint32Array(NUM_BUCKETS);

      for (let i = 0; i < NUM_BUCKETS; i++) {
        bucketBuffers[i] = new Float32Array(MAX_LINES * 4);
      }

      // Pre-computed alpha styles for desktop & mobile
      const stylesDesktop = new Array(NUM_BUCKETS);
      const stylesMobile = new Array(NUM_BUCKETS);

      function updateStyles(isMobile) {
        for (let i = 0; i < NUM_BUCKETS; i++) {
          const factor = (i + 1) / NUM_BUCKETS;
          const desktopAlpha = (factor * 0.88 + 0.12).toFixed(2);
          const mobileAlpha = (factor * 0.82 + 0.15).toFixed(2);

          stylesDesktop[i] = 'rgba(238, 242, 246, ' + desktopAlpha + ')';
          stylesMobile[i]  = 'rgba(238, 242, 246, ' + mobileAlpha + ')';
        }
      }
      updateStyles(false);

      // Per-cell state buffer for smooth hover + symbol transformation
      let cellStates = null;

      // Mouse & Pointer interaction state
      let mouseX = -1000, mouseY = -1000;
      let smoothMX = -1000, smoothMY = -1000;
      let prevMouseX = -1000, prevMouseY = -1000;
      let mouseSpeed = 0;
      let mouseActive = false;
      let mouseAlpha = 0;

      // Scroll interaction state
      let targetScrollY = 0;
      let smoothScrollY = 0;
      let prevScrollY = 0;
      let scrollSpeed = 0;

      function updateMousePos(e) {
        const dpr = window.devicePixelRatio || 1;
        mouseX = e.clientX * dpr;
        mouseY = e.clientY * dpr;
        mouseActive = true;
      }

      window.addEventListener('pointermove', updateMousePos, { passive: true });
      window.addEventListener('pointerleave', () => { mouseActive = false; }, { passive: true });

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          const dpr = window.devicePixelRatio || 1;
          mouseX = e.touches[0].clientX * dpr;
          mouseY = e.touches[0].clientY * dpr;
          mouseActive = true;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          const dpr = window.devicePixelRatio || 1;
          mouseX = e.touches[0].clientX * dpr;
          mouseY = e.touches[0].clientY * dpr;
          mouseActive = true;
        }
      }, { passive: true });

      window.addEventListener('touchend', () => { mouseActive = false; }, { passive: true });

      window.addEventListener('scroll', () => {
        targetScrollY = window.scrollY || window.pageYOffset || 0;
      }, { passive: true });

      window.addEventListener('wheel', (e) => {
        targetScrollY += e.deltaY * 0.5;
      }, { passive: true });

      // Responsive & Zoom-Proof Resize Handler
      function resize() {
        const cssW = window.innerWidth || document.documentElement.clientWidth || 800;
        const cssH = window.innerHeight || document.documentElement.clientHeight || 600;
        const dpr = window.devicePixelRatio || 1;

        physW = Math.round(cssW * dpr);
        physH = Math.round(cssH * dpr);

        canvas.width = physW;
        canvas.height = physH;

        // Responsive Scaling based on device category
        const isMobile = cssW < 768;
        isMobileState = isMobile;
        updateStyles(isMobile);

        const cssGX = isMobile ? 15.0 : 18.0;
        const cssGY = isMobile ? 11.5 : 14.0;
        const cssDash = isMobile ? 5.8 : 7.5;
        const cssHover = isMobile ? 110 : 140;

        GX = Math.max(4, Math.round(cssGX * dpr));
        GY = Math.max(3, Math.round(cssGY * dpr));
        maxHalfDash = cssDash * dpr;
        hoverRadius = cssHover * dpr;
        invRadius = 1 / hoverRadius;
        lineStrokeWidth = Math.max(1.0, (isMobile ? 1.1 : 1.3) * dpr);

        cols = Math.ceil(physW / GX) + 1;
        rows = Math.ceil(physH / GY) + 1;

        const totalCells = cols * rows;
        if (!cellStates || cellStates.length < totalCells) {
          cellStates = new Float32Array(totalCells);
        }
      }

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('load', resize, { passive: true });

      let mediaQuery;
      function watchZoom() {
        if (mediaQuery) mediaQuery.removeEventListener('change', watchZoom);
        const dpr = window.devicePixelRatio || 1;
        mediaQuery = window.matchMedia(`(resolution: ${dpr}dppx)`);
        mediaQuery.addEventListener('change', watchZoom, { once: true });
        resize();
      }
      watchZoom();

      function render(time) {
        requestAnimationFrame(render);

        const t = time * 0.0006;
        const dpr = window.devicePixelRatio || 1;

        // Smooth mouse active fade
        if (mouseActive) {
          mouseAlpha += (1 - mouseAlpha) * 0.12;
        } else {
          mouseAlpha += (0 - mouseAlpha) * 0.08;
        }

        // Smooth mouse position tracking & velocity calculation
        if (smoothMX < -500) {
          smoothMX = mouseX;
          smoothMY = mouseY;
          prevMouseX = mouseX;
          prevMouseY = mouseY;
        } else {
          smoothMX += (mouseX - smoothMX) * 0.18;
          smoothMY += (mouseY - smoothMY) * 0.18;
        }

        const rawSpeed = Math.hypot(smoothMX - prevMouseX, smoothMY - prevMouseY);
        mouseSpeed += (rawSpeed - mouseSpeed) * 0.12;
        prevMouseX = smoothMX;
        prevMouseY = smoothMY;

        // Smooth scroll tracking & speed calculation
        smoothScrollY += (targetScrollY - smoothScrollY) * 0.12;
        const rawScrollSpeed = smoothScrollY - prevScrollY;
        scrollSpeed += (rawScrollSpeed - scrollSpeed) * 0.15;
        prevScrollY = smoothScrollY;

        const normMX = physW ? smoothMX / physW : 0.5;
        const normMY = physH ? smoothMY / physH : 0.5;
        const scrollOffsetY = smoothScrollY * 0.0003;
        const absScrollSpeed = Math.min(2.0, Math.abs(scrollSpeed) * 0.02);
        const scrollWaveSurge = Math.sin(t * 3.0) * (scrollSpeed * 0.002);

        bucketCounts.fill(0);

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, physW, physH);

        const invW = 1 / (physW || 1);
        const invH = 1 / (physH || 1);
        const aspectRatio = physW / (physH || 1);
        // Aspect ratio compensation for portrait screens
        const aspectScale = aspectRatio < 1.0 ? (1.0 / aspectRatio) * 0.72 : 1.0;

        let cellIdx = 0;
        for (let r = 0; r < rows; r++) {
          const y = r * GY;
          const ny = y * invH + scrollOffsetY;
          const dy = (y * invH) - 0.5;
          const dyMouse = y - smoothMY;

          for (let c = 0; c < cols; c++) {
            const x = c * GX;
            const nx = x * invW;
            const dx = nx - 0.5;
            const dxScaled = dx * aspectScale;
            const dxMouse = x - smoothMX;

            let targetState = 0;
            if (mouseAlpha > 0.001) {
              const distSq = dxMouse * dxMouse + dyMouse * dyMouse;
              if (distSq < hoverRadius * hoverRadius) {
                const dist = Math.sqrt(distSq);
                const norm = 1 - dist * invRadius;
                targetState = norm * norm * mouseAlpha;
              }
            }

            let curState = cellStates ? cellStates[cellIdx] : 0;
            curState += (targetState - curState) * 0.2;
            if (cellStates) cellStates[cellIdx] = curState;
            cellIdx++;

            // Mouse fluid wave deflection and radial ripple disturbance
            const distNormM = Math.hypot(nx - normMX, (y * invH) - normMY);
            const mouseRipple = Math.sin(distNormM * 24.0 - t * 3.5)
                              * Math.max(0, 1.0 - distNormM * 3.0)
                              * (0.25 + mouseSpeed * 0.008)
                              * mouseAlpha;

            const mouseDeflect = Math.cos(distNormM * 14.0 - t * 2.0)
                               * Math.max(0, 1.0 - distNormM * 2.2)
                               * 0.18
                               * mouseAlpha;

            const wave1 = Math.sin(nx * 6.28 * 1.4 + t * 1.0 + mouseDeflect) * 0.16
                     + Math.cos(ny * 6.28 * 2.2 - t * 0.7 + (normMX - 0.5) * mouseAlpha * 0.4 + scrollWaveSurge) * 0.08;
            const wave2 = Math.sin(ny * 6.28 * 1.1 + nx * 3.14 + t * 0.5 + (normMY - 0.5) * mouseAlpha * 0.4) * 0.12;

            const centerDist = Math.abs(dxScaled * 1.3 + wave1);
            const yMod = Math.cos(dy * 2.6 + wave2);

            let intensity = (1.0 - centerDist * 1.4) * yMod;

            const ripple = Math.sin(nx * 16.0 - ny * 12.0 + t * 1.3 + mouseRipple * 3.5) * 0.28;
            if (intensity > 0.08) {
              intensity += ripple * 0.35 + mouseRipple * 0.3 + absScrollSpeed * 0.15;
            } else {
              intensity += mouseRipple * 0.2 + absScrollSpeed * 0.08;
            }

            if (curState > 0.01) {
              intensity = Math.max(intensity, 0.35 * curState);
            }

            if (intensity <= 0.04) continue;
            if (intensity > 1.0) intensity = 1.0;

            const halfLen = (0.8 * dpr) + intensity * maxHalfDash;
            const bIdx = (intensity * (NUM_BUCKETS - 1)) | 0;

            const cnt = bucketCounts[bIdx];
            if (cnt < MAX_LINES) {
              const buf = bucketBuffers[bIdx];
              const idx = cnt << 2;
              buf[idx]     = x - halfLen;
              buf[idx + 1] = y;
              buf[idx + 2] = x + halfLen;
              buf[idx + 3] = y;
              let added = 1;

              // Convert dashes to plus symbol when hovered
              if (curState > 0.02) {
                const vertHalfLen = halfLen * curState;
                if (cnt + 1 < MAX_LINES) {
                  buf[idx + 4] = x;
                  buf[idx + 5] = y - vertHalfLen;
                  buf[idx + 6] = x;
                  buf[idx + 7] = y + vertHalfLen;
                  added = 2;
                }
              }
              bucketCounts[bIdx] = cnt + added;
            }
          }
        }

        ctx.lineWidth = lineStrokeWidth;
        ctx.lineCap = 'butt';

        const activeStyles = isMobileState ? stylesMobile : stylesDesktop;
        for (let i = 0; i < NUM_BUCKETS; i++) {
          const count = bucketCounts[i];
          if (count === 0) continue;

          const buf = bucketBuffers[i];
          ctx.strokeStyle = activeStyles[i];
          ctx.beginPath();

          const total = count << 2;
          for (let j = 0; j < total; j += 4) {
            ctx.moveTo(buf[j], buf[j + 1]);
            ctx.lineTo(buf[j + 2], buf[j + 3]);
          }
          ctx.stroke();
        }
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
